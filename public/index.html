<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6c5cff">
  <meta name="description" content="한 줄의 요청으로 완성도 높은 글을 만드는 AI 글쓰기 도구">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self' https://lumen-git-main-hoony2.vercel.app https://lumen-blxbzzpaz-hoony2.vercel.app; font-src 'self'; form-action 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico?v=165-security1">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=165-security1">
  <link rel="stylesheet" href="./styles.css">
  <title>Lumen AI</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">L</div>
        <div><h1>Lumen AI</h1><p>한 줄로 시작하는 AI 글쓰기</p></div>
      </div>
      <div class="top-actions">
        <button id="historyButton" class="ghost" type="button">작성 이력</button>
        <button id="installButton" class="install hidden" type="button">앱 설치</button>
      </div>
    </header>

    <section class="hero">
      <h2>생각만 적으세요.<br>완성된 글은 AI가 만듭니다.</h2>
      <p>목적과 분위기를 선택하면 블로그, 이메일, 마케팅 문구까지 바로 사용할 수 있는 글로 작성합니다.</p>
    </section>

    <section id="inputCard" class="card">
      <div class="section-head">
        <h3 class="section-title">글쓰기 설정</h3>
        <span class="hint">Ctrl + Enter로 생성</span>
      </div>
      <div class="preset-row" aria-label="글 종류 선택">
        <button class="preset active" data-preset="자유" type="button">자유 작성</button>
        <button class="preset" data-preset="블로그" type="button">블로그</button>
        <button class="preset" data-preset="유튜브" type="button">유튜브</button>
        <button class="preset" data-preset="마케팅" type="button">마케팅</button>
        <button class="preset" data-preset="자기소개서" type="button">자기소개서</button>
        <button class="preset" data-preset="이메일" type="button">이메일</button>
      </div>
      <div class="controls">
        <div class="control">
          <label for="tone">문체</label>
          <select id="tone">
            <option>자연스럽게</option><option>친근하게</option><option>전문적으로</option>
            <option>설득력 있게</option><option>간결하게</option>
          </select>
        </div>
        <div class="control">
          <label for="length">분량</label>
          <select id="length">
            <option value="short">짧게</option><option value="medium" selected>보통</option><option value="long">길게</option>
          </select>
        </div>
      </div>
      <label class="field-label" for="request">글쓰기 요청</label>
      <div class="textarea-wrap">
        <textarea id="request" maxlength="2000" placeholder="예: 일본어 학습 앱 사용 후기를 네이버 블로그에 올릴 수 있도록 친근하고 자세하게 작성해줘"></textarea>
        <span class="count"><span id="requestCount">0</span>/2000</span>
      </div>
      <div class="examples">
        <button class="example" data-example="초보자를 위한 일본어 학습 앱 소개 글을 작성해줘" type="button">앱 소개</button>
        <button class="example" data-example="회의 일정 변경을 알리는 정중한 업무 이메일을 작성해줘" type="button">업무 이메일</button>
        <button class="example" data-example="신제품의 핵심 장점을 강조하는 짧은 홍보 문구를 작성해줘" type="button">홍보 문구</button>
      </div>
      <button id="writeButton" class="primary" type="button">AI로 글 작성</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="resultCard" class="card hidden">
      <div class="result-toolbar">
        <h3 class="section-title">작성 결과</h3>
        <span id="resultMeta" class="meta"></span>
      </div>
      <p id="resultStatus" class="status result-status" aria-live="polite"></p>
      <textarea id="result" class="result-editor" maxlength="12000" aria-label="작성 결과 편집"></textarea>
      <div class="quick-rewrite" aria-label="빠른 재작성">
        <button class="quick" data-instruction="더 짧고 핵심적으로 다듬어줘" type="button">더 짧게</button>
        <button class="quick" data-instruction="내용을 더 풍부하고 자세하게 확장해줘" type="button">더 길게</button>
        <button class="quick" data-instruction="문장을 더 자연스럽고 매끄럽게 다듬어줘" type="button">자연스럽게</button>
        <button class="quick" data-instruction="더 전문적이고 신뢰감 있는 문체로 바꿔줘" type="button">전문적으로</button>
        <button class="quick" data-instruction="맞춤법과 띄어쓰기, 어색한 표현을 교정해줘" type="button">맞춤법 교정</button>
      </div>
      <div class="actions">
        <button id="copyButton" class="secondary" type="button" disabled>복사</button>
        <button id="retryButton" class="secondary" type="button" disabled>다시 생성</button>
        <button id="restoreButton" class="secondary" type="button" disabled>원본 복원</button>
        <button id="downloadButton" class="secondary" type="button" disabled>TXT 저장</button>
      </div>
      <div id="editArea" class="edit-area hidden">
        <label class="field-label" for="editRequest">AI에게 수정 요청</label>
        <div class="edit-row">
          <textarea id="editRequest" maxlength="500" placeholder="예: 더 친근하게 바꿔줘"></textarea>
          <button id="editButton" class="edit-button" type="button">수정하기</button>
        </div>
      </div>
      <button id="newButton" class="primary new-button" type="button">새 글 작성</button>
    </section>

    <footer class="footer">
      <p>민감한 개인정보는 입력하지 마세요. AI 결과는 사용 전 확인이 필요합니다.</p>
      <p>작성 요청과 결과는 이 브라우저에 최대 30일 저장됩니다. 공유 기기에서는 작성 이력을 삭제하세요.</p>
    </footer>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="historyDrawer" class="drawer hidden" aria-label="작성 이력">
    <div class="drawer-head">
      <h2>작성 이력</h2>
      <button id="closeHistory" class="ghost" type="button">닫기</button>
    </div>
    <div id="historyList" class="history-list"></div>
    <div class="drawer-foot">
      <p class="privacy-note">이 브라우저에만 최대 30일 보관됩니다.</p>
      <button id="clearHistory" class="secondary danger full-width" type="button">이력 전체 삭제</button>
    </div>
  </aside>
</body>
</html>
