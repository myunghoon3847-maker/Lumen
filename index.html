<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d5dfc">
  <meta name="description" content="한 줄 요청으로 완성된 글을 작성하는 AI 글쓰기 웹앱">
  <title>Lumen AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root{
      --bg:#f6f7fb;--card:#fff;--text:#202124;--muted:#737784;
      --line:#e6e8ef;--primary:#6d5dfc;--primary2:#8c7cff;
      --danger:#b42318;--danger-bg:#fff5f4;--result:#fafafe;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    button,textarea{font:inherit}
    main{width:min(720px,100%);margin:auto;min-height:100dvh;
      padding:calc(18px + env(safe-area-inset-top)) 16px calc(42px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:11px;padding:6px 0 25px}
    .logo{width:46px;height:46px;border-radius:15px;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.25rem;
      box-shadow:0 10px 24px rgba(109,93,252,.24)}
    h1{margin:0;font-size:1.17rem}.sub{margin:2px 0 0;color:var(--muted);font-size:.82rem}
    .hero{margin:2px 0 20px}
    .hero h2{font-size:1.76rem;line-height:1.28;margin:0 0 9px;letter-spacing:-.035em}
    .hero p{margin:0;color:var(--muted);line-height:1.55}
    .card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:18px;
      box-shadow:0 12px 34px rgba(38,36,70,.07);margin-bottom:16px}
    label{display:block;font-weight:850;margin-bottom:9px;font-size:1rem}
    textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);
      border-radius:16px;padding:15px;color:var(--text);background:#fff;line-height:1.58;outline:none}
    textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(109,93,252,.14)}
    .count{text-align:right;color:var(--muted);font-size:.78rem;margin:5px 2px 0}
    button{width:100%;border:0;border-radius:15px;padding:14px 16px;font-weight:850;cursor:pointer}
    button:focus-visible{outline:3px solid rgba(109,93,252,.3);outline-offset:2px}
    .primary{background:var(--primary);color:#fff;margin-top:12px}
    .primary:active{transform:translateY(1px)}
    .primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .secondary{background:#f0efff;color:#4c3ed4;margin-top:10px}
    .result{min-height:230px;white-space:pre-wrap;line-height:1.76;background:var(--result);
      border:1px solid var(--line);border-radius:16px;padding:16px;overflow-wrap:anywhere}
    .empty{color:var(--muted);display:grid;place-items:center;text-align:center}
    .error{color:var(--danger);background:var(--danger-bg);border-color:#efc8c3;display:block}
    .status{color:var(--muted);font-size:.84rem;margin:10px 2px 0;min-height:1.3em}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.45);
      border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;
      vertical-align:-3px;margin-right:7px}
    .footer{text-align:center;color:var(--muted);font-size:.76rem;padding-top:5px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:500px){
      main{padding-left:14px;padding-right:14px}
      .hero h2{font-size:1.5rem}.card{padding:15px}.result{min-height:210px}
    }
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}.primary:active{transform:none}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">L</div>
    <div><h1>Lumen AI</h1><p class="sub">한 줄로 시작하는 AI 글쓰기</p></div>
  </header>

  <section class="hero">
    <h2>무엇을 쓰고 싶은지<br>편하게 적어보세요.</h2>
    <p>주제와 원하는 내용을 입력하면 완성된 글을 작성합니다.</p>
  </section>

  <section class="card">
    <label for="request">글쓰기 요청</label>
    <textarea id="request" maxlength="2000"
      placeholder="예: 일본어 초보자에게 하루니혼 앱을 소개하는 친근한 블로그 글을 써줘. 음성 기능과 기초 단어 학습의 장점을 포함해줘."></textarea>
    <div class="count"><span id="count">0</span>/2000</div>
    <button id="writeBtn" class="primary" type="button">글쓰기</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card">
    <label for="result">작성 결과</label>
    <div id="result" class="result empty" tabindex="0" aria-live="polite">
      작성된 글이 여기에 표시됩니다.
    </div>
    <button id="copyBtn" class="secondary" type="button">결과 복사</button>
  </section>

  <p class="footer">AI가 작성한 내용은 사용 전 사실관계를 확인해 주세요.</p>
</main>

<script>
(() => {
  "use strict";

  const requestEl = document.querySelector("#request");
  const countEl = document.querySelector("#count");
  const writeBtn = document.querySelector("#writeBtn");
  const resultEl = document.querySelector("#result");
  const statusEl = document.querySelector("#status");
  const copyBtn = document.querySelector("#copyBtn");

  requestEl.addEventListener("input", () => {
    countEl.textContent = requestEl.value.length;
  });

  requestEl.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      writeBtn.click();
    }
  });

  writeBtn.addEventListener("click", async () => {
    const request = requestEl.value.trim();

    if (!request) {
      statusEl.textContent = "먼저 쓰고 싶은 내용을 입력해 주세요.";
      requestEl.focus();
      return;
    }

    setLoading(true);
    statusEl.textContent = "";
    resultEl.className = "result empty";
    resultEl.textContent = "글을 작성하고 있습니다.";

    try {
      const response = await fetch("/api/write", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({request})
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "글을 작성하지 못했습니다.");
      }

      if (!data.text || typeof data.text !== "string") {
        throw new Error("AI가 빈 결과를 반환했습니다.");
      }

      resultEl.className = "result";
      resultEl.textContent = data.text.trim();
      statusEl.textContent = "글쓰기가 완료되었습니다.";
      resultEl.focus();
    } catch (error) {
      resultEl.className = "result error";
      resultEl.textContent = friendlyError(error);
      statusEl.textContent = "글쓰기 중 오류가 발생했습니다.";
    } finally {
      setLoading(false);
    }
  });

  copyBtn.addEventListener("click", async () => {
    if (resultEl.classList.contains("empty") || resultEl.classList.contains("error")) {
      statusEl.textContent = "복사할 결과가 없습니다.";
      return;
    }

    try {
      await navigator.clipboard.writeText(resultEl.textContent.trim());
      statusEl.textContent = "결과를 복사했습니다.";
    } catch {
      const area = document.createElement("textarea");
      area.value = resultEl.textContent.trim();
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      statusEl.textContent = "결과를 복사했습니다.";
    }
  });

  function setLoading(isLoading) {
    writeBtn.disabled = isLoading;
    writeBtn.innerHTML = isLoading
      ? '<span class="spinner" aria-hidden="true"></span>작성 중'
      : "글쓰기";
  }

  function friendlyError(error) {
    const message = String(error?.message || "");

    if (message.includes("API_KEY_MISSING")) {
      return "배포 서버에 OpenAI API 키가 설정되지 않았습니다.";
    }
    if (message.includes("RATE_LIMIT")) {
      return "현재 요청이 많습니다. 잠시 후 다시 시도해 주세요.";
    }
    if (message.includes("QUOTA")) {
      return "OpenAI API 사용 한도 또는 결제 설정을 확인해 주세요.";
    }
    if (message.includes("MODEL")) {
      return "설정된 AI 모델을 사용할 수 없습니다. 서버의 모델 설정을 확인해 주세요.";
    }
    if (message.includes("Failed to fetch")) {
      return "서버에 연결하지 못했습니다. 인터넷 연결과 배포 상태를 확인해 주세요.";
    }
    return message || "알 수 없는 오류가 발생했습니다.";
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
